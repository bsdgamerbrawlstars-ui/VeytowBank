<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VTBank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<script>
(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --bg:#f5f1e8;--card:#fffdf9;--text:#171a22;--muted:#767b88;--line:#e4dfd2;--input:#faf7f0;
  --accent:#1f5fff;--link:#1f5fff;--grad:linear-gradient(135deg,#1442d8,#3d8bff);--btn-text:#fff;
  --ok:#0f8a5f;--err:#d63a3a;--glow:rgba(31,95,255,.11);--glow2:rgba(214,170,90,.2);
  --shadow:0 28px 60px -28px rgba(70,50,10,.32),0 2px 8px rgba(70,50,10,.07);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080e1f;--card:#0f1a33;--text:#e8eefc;--muted:#8793b2;--line:#1d2b4d;--input:#0a1329;
    --accent:#5aa2ff;--link:#6aaeff;--grad:linear-gradient(135deg,#3d7bff,#2fe0d4);--btn-text:#03101f;
    --ok:#3fe3a6;--err:#ff6b7d;--glow:rgba(90,162,255,.16);--glow2:rgba(47,224,212,.14);
    --shadow:0 30px 70px -30px rgba(0,0,0,.8),0 0 0 1px rgba(90,162,255,.08);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080e1f;--card:#0f1a33;--text:#e8eefc;--muted:#8793b2;--line:#1d2b4d;--input:#0a1329;
  --accent:#5aa2ff;--link:#6aaeff;--grad:linear-gradient(135deg,#3d7bff,#2fe0d4);--btn-text:#03101f;
  --ok:#3fe3a6;--err:#ff6b7d;--glow:rgba(90,162,255,.16);--glow2:rgba(47,224,212,.14);
  --shadow:0 30px 70px -30px rgba(0,0,0,.8),0 0 0 1px rgba(90,162,255,.08);color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;display:flex;flex-direction:column;
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);
  background:radial-gradient(55% 40% at 90% 0%,var(--glow),transparent 70%),radial-gradient(50% 40% at 0% 100%,var(--glow2),transparent 70%),var(--bg);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);transition:background-color .45s}
body,.top,.card,.field,input,.theme,.nav,.sheet,.nb,.back{transition:background-color .45s,border-color .35s,color .45s,box-shadow .35s}
button{font-family:inherit}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.03em}
.logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center}
.logo svg{width:18px;height:18px;fill:none;stroke:var(--btn-text);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.theme{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;padding:0}
.theme svg{position:absolute;inset:0;margin:auto;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.theme .sun{opacity:0;transform:rotate(-90deg) scale(.4)}
:root[data-theme="dark"] .theme .moon{opacity:0;transform:rotate(90deg) scale(.4)}
:root[data-theme="dark"] .theme .sun{opacity:1;transform:none;color:var(--accent)}
.theme:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

#auth{flex:1;display:grid;place-items:center;padding:8px 16px 32px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}
.progress{height:4px;border-radius:4px;background:var(--line);margin:0 0 26px;overflow:hidden}
.progress i{display:block;height:100%;width:50%;border-radius:4px;background:var(--grad);transition:width .5s cubic-bezier(.3,.9,.3,1)}
h1,h2{margin:0 0 8px;line-height:1.15;letter-spacing:-.03em;font-weight:800}
h1{font-size:27px}h2{font-size:28px}
.sub{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.5}
label{display:block;font-size:13px;font-weight:700;margin:0 0 8px}
.field{display:flex;align-items:center;gap:6px;height:56px;padding:0 14px 0 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--input)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.field .at{color:var(--accent);font-weight:800;font-size:18px}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--text);font-family:inherit;font-size:16px;font-weight:600}
.field input::placeholder{color:var(--muted);font-weight:500}
.field.is-ok{border-color:var(--ok)}
.field.is-err{border-color:var(--err);box-shadow:0 0 0 4px rgba(214,58,58,.18);box-shadow:0 0 0 4px color-mix(in srgb,var(--err) 18%,transparent);animation:shake .35s}
.st{width:22px;height:22px;display:grid;place-items:center}
.st>*{display:none}
.is-load .st .sp,.is-ok .st .okk,.is-err .st .bad{display:block}
.st svg{width:22px;height:22px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.okk{stroke:var(--ok)}.bad{stroke:var(--err)}
.sp{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite}
.eye{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:8px;display:grid}
.eye svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye .slash{opacity:0;transition:opacity .2s}.eye.on .slash{opacity:1}
.msg{min-height:22px;margin:9px 2px 0;font-size:13.5px;font-weight:600;color:var(--muted);transition:color .25s}
.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
.gap{height:14px}
.btn{position:relative;width:100%;height:54px;margin-top:16px;border:0;border-radius:16px;cursor:pointer;background:var(--grad);color:var(--btn-text);font-family:inherit;font-weight:800;font-size:16px;letter-spacing:-.01em;box-shadow:0 14px 28px -14px var(--accent);transition:transform .2s,opacity .3s,box-shadow .3s,filter .3s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn .sp{display:none;position:absolute;inset:0;margin:auto;border-color:rgba(0,0,0,.18);border-top-color:var(--btn-text)}
.btn.busy .lbl{opacity:0}.btn.busy .sp{display:block}
.alt{margin:18px 0 0;text-align:center;font-size:13.5px;color:var(--muted)}
.lnk{border:0;background:none;padding:0;color:var(--link);font-weight:700;font-size:13.5px;cursor:pointer}
.lnk:hover{text-decoration:underline}
.back{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;padding:7px 12px 7px 8px;border:1px solid var(--line);border-radius:999px;background:var(--input);color:var(--text);font-weight:700;font-size:14px;cursor:pointer}
.back:hover{border-color:var(--accent)}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.enter{animation:in .4s cubic-bezier(.2,.8,.2,1)}
.step.leave{opacity:0;transform:translateX(-22px);transition:opacity .22s,transform .22s}

#app{width:100%;max-width:480px;margin:0 auto;padding:6px 16px 120px}
.add{width:100%;height:54px;margin-bottom:16px;border:1.5px dashed var(--accent);border-radius:18px;background:var(--glow);color:var(--accent);font-weight:800;font-size:16px;cursor:pointer;transition:transform .2s}
.add:hover{transform:translateY(-2px)}
.empty{margin:30px 8px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
.cc{position:relative;display:flex;flex-direction:column;justify-content:space-between;width:100%;aspect-ratio:1.75;margin:0 0 14px;padding:18px 20px;border:0;border-radius:24px;color:#fff;text-align:left;cursor:pointer;overflow:hidden;box-shadow:0 22px 34px -22px rgba(10,20,60,.7);transition:transform .25s}
button.cc:hover{transform:translateY(-3px)}
.cc.flat{cursor:default;margin:0}
.cc::after{content:"";position:absolute;right:-60px;top:-70px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none}
.cc .r{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
.cc .r b{font-size:18px;letter-spacing:-.02em}
.chip{width:38px;height:28px;border-radius:7px;background:rgba(255,255,255,.38)}
.cc.new{animation:pop .6s cubic-bezier(.2,1.2,.3,1)}
.t0{background:linear-gradient(135deg,#1442d8,#3d8bff)}.t1{background:linear-gradient(135deg,#262d44,#0a0d17)}
.t2{background:linear-gradient(135deg,#7a2cf0,#d45bff)}.t3{background:linear-gradient(135deg,#087f63,#2fd9a4)}
.t4{background:linear-gradient(135deg,#e0502a,#ff9a3c)}.t5{background:linear-gradient(135deg,#0f6dbd,#18c3e8)}
.t6{background:linear-gradient(135deg,#c21f5b,#ff6a8a)}
.rows div{display:flex;justify-content:space-between;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px}
.rows div:last-child{border:0}
.rows span{color:var(--muted);font-weight:600}.rows b{font-weight:800;text-align:right;word-break:break-all}
.tx{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ti{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--glow);color:var(--accent)}
.ti svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.m{flex:1;min-width:0}.m b{display:block;font-size:15px}.m span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.a{font-weight:800;white-space:nowrap}.a.in{color:var(--ok)}
.ava{width:84px;height:84px;margin:8px auto 12px;border-radius:50%;background:var(--grad);color:var(--btn-text);display:grid;place-items:center;font-size:34px;font-weight:800}
.pn{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.02em}
.pbox{margin:20px 0 8px;padding:4px 16px;background:var(--card);border:1px solid var(--line);border-radius:20px}
.ghost{display:block;width:100%;margin-top:6px;border:0;background:none;color:var(--muted);font-weight:700;font-size:15px;cursor:pointer;padding:12px}
.ghost:hover{color:var(--text)}.ghost.danger{color:var(--err)}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:8;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -12px 30px -20px rgba(20,30,60,.45)}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:0;border-radius:16px;background:none;color:var(--muted);font-weight:700;font-size:11.5px;cursor:pointer}
.nb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--accent);background:var(--glow)}
.bg{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,10,25,.55);animation:fade .25s}
.sheet{width:100%;max-width:480px;max-height:94%;overflow:auto;padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:28px 28px 0 0;animation:up .35s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;margin:0 auto 16px;border-radius:5px;background:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100% - 32px);padding:13px 18px;border-radius:14px;background:var(--text);color:var(--card);font-weight:700;font-size:14.5px;text-align:center;opacity:0;transform:translate(-50%,20px);pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.toast.err{background:var(--err);color:#fff}
.toast.show{opacity:1;transform:translate(-50%,0)}
.cc .bl{position:relative;z-index:1;display:block;font-size:27px;font-weight:800;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:20px;background:var(--input);border:1px solid var(--line);border-radius:16px}
.seg button{border:0;border-radius:12px;padding:11px 6px;background:none;color:var(--muted);font-weight:700;font-size:13.5px;line-height:1.25;cursor:pointer;transition:background-color .3s,color .3s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 10px -4px rgba(0,0,0,.35)}
.field select{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--text);font-family:inherit;font-size:16px;font-weight:600}
.field select option{background:var(--card);color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.h3{margin:26px 0 6px;font-size:19px;font-weight:800;letter-spacing:-.02em}
.cr{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:10px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);text-align:left;cursor:pointer;transition:border-color .25s,transform .2s}
.cr:hover{border-color:var(--accent);transform:translateY(-1px)}
.cr svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.srch{margin-bottom:12px}
.srch svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.clist{max-height:48vh;overflow:auto;margin:0 -4px 6px;padding:0 4px}
.ci{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin-bottom:6px;padding:13px 14px;border:1px solid transparent;border-radius:14px;background:none;color:var(--text);font-size:15px;text-align:left;cursor:pointer}
.ci:hover{background:var(--input)}
.ci.on{border-color:var(--accent);background:var(--glow)}
.ci b{font-weight:700}.ci em{font-style:normal;font-weight:800;font-size:13px;color:var(--accent)}
.pr{font-weight:800;font-size:16px;text-align:right;white-space:nowrap}
.pr s{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.ci small{display:block;margin-top:2px;font-size:12.5px;font-weight:700;color:var(--ok)}
.note{margin:12px 2px 4px;color:var(--muted);font-size:13px;line-height:1.5}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes in{from{opacity:0;transform:translateX(24px)}}
@keyframes shake{25%{transform:translateX(-5px)}60%{transform:translateX(5px)}100%{transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(26px) rotate(-3deg) scale(.93)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@media (max-width:420px){.card{padding:22px;border-radius:24px}h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M5 6l7 12 7-12"/></svg></span>VTBank</div>
  <button class="theme" id="theme" type="button" aria-label="Переключить тему" title="Сменить тему">
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main id="auth"><div class="card">
  <div class="progress"><i id="bar"></i></div>

  <section class="step" id="s1">
    <h1>Откройте счёт в VTBank</h1>
    <p class="sub">Выберите @username — по нему вам смогут отправить перевод.</p>
    <label for="user">Ваш @username</label>
    <div class="field" id="uf">
      <span class="at">@</span>
      <input id="user" type="text" placeholder="username" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false">
      <span class="st"><i class="sp"></i>
        <svg class="okk" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <svg class="bad" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
    </div>
    <div class="msg" id="umsg" aria-live="polite"></div>
    <button class="btn" id="next" type="button" hidden>Продолжить</button>
    <p class="alt">Уже есть аккаунт? <button class="lnk" id="toLogin" type="button">Войти</button></p>
  </section>

  <section class="step" id="s2" hidden>
    <button class="back" id="back" type="button"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="chip"></span></button>
    <h1>Придумайте пароль</h1>
    <p class="sub">Минимум 6 символов. Никому его не сообщайте.</p>
    <label for="p1">Придумайте пароль</label>
    <div class="field" id="f1">
      <input id="p1" type="password" placeholder="Пароль" autocomplete="new-password">
      <button class="eye" type="button" data-for="p1" aria-label="Показать пароль"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
    </div>
    <div class="gap"></div>
    <label for="p2">Повторите пароль</label>
    <div class="field" id="f2">
      <input id="p2" type="password" placeholder="Ещё раз тот же пароль" autocomplete="new-password">
      <button class="eye" type="button" data-for="p2" aria-label="Показать пароль"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
    </div>
    <div class="msg" id="pmsg" aria-live="polite"></div>
    <button class="btn" id="create" type="button" disabled><span class="lbl">Войти в VTBank</span><i class="sp"></i></button>
  </section>

  <section class="step" id="sl" hidden>
    <h1>С возвращением</h1>
    <p class="sub">Войдите в свой аккаунт VTBank.</p>
    <label for="lu">Ваш @username</label>
    <div class="field" id="lf1"><span class="at">@</span>
      <input id="lu" type="text" placeholder="username" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
    <div class="gap"></div>
    <label for="lp">Пароль</label>
    <div class="field" id="lf2">
      <input id="lp" type="password" placeholder="Ваш пароль" autocomplete="current-password">
      <button class="eye" type="button" data-for="lp" aria-label="Показать пароль"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
    </div>
    <div class="msg" id="lmsg" aria-live="polite"></div>
    <button class="btn" id="login" type="button" disabled><span class="lbl">Войти в VTBank</span><i class="sp"></i></button>
    <p class="alt">Нет аккаунта? <button class="lnk" id="toReg" type="button">Зарегистрироваться</button></p>
  </section>
</div></main>

<main id="app" hidden><div id="view"></div></main>

<nav class="nav" id="nav" hidden>
  <button class="nb on" data-t="cards" type="button"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>Карточки</button>
  <button class="nb" data-t="send" type="button"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>Перевести</button>

<script>
(function(){
/* ===== Настройки ===== */

var RESERVED=['admin','alex','vtbank'];

var root=document.documentElement,db,me=null,tab='cards',sel=0,mode='send',newIdx=-1;

/* ---------- данные ---------- */
try{db=JSON.parse(localStorage.getItem('vtbank_db'))}catch(e){db=null}
if(!db||!db.users)db={users:{}};
if(!db.users.admin)db.users.admin={cards:[],tx:[],inf:true,created:Date.now()};
Object.keys(db.users).forEach(function(n){
  var u=db.users[n];
  u.cards.forEach(function(c,i){
    if(c.bal===undefined)c.bal=(i===0&&!u.inf?u.bal||0:0);
    if(c.inf===undefined)c.inf=!!u.inf;
    if(!c.pwd)c.pwd=rnd(4);
    if(!c.cur)c.cur='RUB';
  });
  delete u.bal;
  if(u.bonus===undefined)u.bonus=!u.cards.length&&!u.inf;
  u.tx=u.tx.filter(function(x){return !x.who}).map(function(x){if(x.tail)x.card=x.tail;return x});
});
if(db.claimed===undefined){ /* миграция: бонус остаётся только у самого раннего аккаунта */
  var regs=Object.keys(db.users).filter(function(n){return !Object.prototype.hasOwnProperty.call(FIXED,n)}).sort(function(a,b){return db.users[a].created-db.users[b].created});
  db.claimed=regs[0]||'';
  regs.slice(1).forEach(function(n){db.users[n].bonus=false});
  save();
}
if(!Object.prototype.hasOwnProperty.call(db.users,'winstone')){
  var wc=mkCard(5000,false);
  db.users.winstone={pass:FIXED.winstone,cards:[wc],tx:[{t:'card',card:wc.num.slice(-4),ts:Date.now()}],inf:false,bonus:false,created:Date.now()};
  save();
}
function save(){try{localStorage.setItem('vtbank_db',JSON.stringify(db))}catch(e){}}
function has(n){return Object.prototype.hasOwnProperty.call(db.users,n)}
function taken(n){return RESERVED.indexOf(n)>-1||has(n)}
function passOf(n){return Object.prototype.hasOwnProperty.call(FIXED,n)?FIXED[n]:db.users[n].pass}
function U(){return db.users[me]}
function fmt(n){return n.toLocaleString(LOC[lang],{maximumFractionDigits:2})}
function money(u){return u.inf?'∞ ₽':fmt(u.bal)+' ₽'}
function when(ts){return new Date(ts).toLocaleString(LOC[lang],{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}
function spaced(n){return n.replace(/(\d{4})(?=\d)/g,'$1 ')}
function rnd(k){var s='';for(var i=0;i<k;i++)s+=Math.floor(Math.random()*10);return s}
function clean(v){return v.toLowerCase().replace(/[^a-z0-9_]/g,'').replace(/^[^a-z]+/,'').slice(0,20)}
function setField(el,s){el.classList.remove('is-load','is-ok','is-err');if(s)el.classList.add('is-'+s)}
function setMsg(el,k,t){el.className='msg'+(k?' '+k:'');el.textContent=t}
var tt;
function toast(t,k){var el=$('#toast');el.textContent=t;el.className='toast '+(k||'')+' show';clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show')},2800)}

/* ---------- тема ---------- */
$('#theme').addEventListener('click',function(){
  var n=root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',n);
  try{localStorage.setItem('theme',n)}catch(e){}
});

/* ---------- шаги входа ---------- */
var cur='s1',moving=false;
function show(id){
  if(moving||id===cur)return;moving=true;
  var from=$('#'+cur),to=$('#'+id);
  from.classList.add('leave');
  setTimeout(function(){
    from.hidden=true;from.classList.remove('leave');
    to.hidden=false;to.classList.add('enter');
    setTimeout(function(){to.classList.remove('enter')},450);
    cur=id;moving=false;$('#bar').style.width=id==='s1'?'50%':'100%';
    if(id==='s1')ui.focus();if(id==='s2')p1.focus();if(id==='sl')lu.focus();
  },220);
}
var HINT1='Латиница, цифры и _, от 3 символов';
var HINT2='Повторите пароль, чтобы исключить опечатки';

/* Шаг 1: @username */
var ui=$('#user'),uf=$('#uf'),umsg=$('#umsg'),next=$('#next');
var timer,token=0,available=false;
setMsg(umsg,'',HINT1);
ui.addEventListener('input',function(){
  ui.value=clean(ui.value);var v=ui.value;
  clearTimeout(timer);available=false;next.hidden=true;
  if(!v){setField(uf,'');setMsg(umsg,'',HINT1);return}
  if(v.length<3){setField(uf,'');setMsg(umsg,'','Ещё минимум '+(3-v.length)+' симв.');return}
  setField(uf,'load');setMsg(umsg,'','Проверяем имя…');
  var t=++token;
  timer=setTimeout(function(){
    if(t!==token)return;
    if(taken(v)){setField(uf,'err');setMsg(umsg,'err','Этот @username уже занят')}
    else{setField(uf,'ok');setMsg(umsg,'ok','Имя доступно!');available=true;next.hidden=false}
  },800);
});
function goNext(){if(!available)return;$('#chip').textContent='@'+ui.value;show('s2')}
ui.addEventListener('keydown',function(e){if(e.key==='Enter')goNext()});
next.addEventListener('click',goNext);
$('#toLogin').addEventListener('click',function(){show('sl')});
$('#toReg').addEventListener('click',function(){show('s1')});

/* Шаг 2: пароль */
var p1=$('#p1'),p2=$('#p2'),f1=$('#f1'),f2=$('#f2'),pmsg=$('#pmsg'),create=$('#create');
function checkPw(){
  var a=p1.value,b=p2.value,ok=false;
  setField(f1,'');setField(f2,'');
  if(!b)setMsg(pmsg,'',HINT2);
  else if(a!==b){setField(f1,'err');setField(f2,'err');setMsg(pmsg,'err','Пароли не совпадают')}
  else if(a.length<6){setField(f1,'err');setMsg(pmsg,'err','Пароль слишком короткий — минимум 6 символов')}
  else{setField(f1,'ok');setField(f2,'ok');setMsg(pmsg,'ok','Пароли совпадают');ok=true}
  create.disabled=!ok;
}
checkPw();
p1.addEventListener('input',checkPw);p2.addEventListener('input',checkPw);
p1.addEventListener('keydown',function(e){if(e.key==='Enter')p2.focus()});
p2.addEventListener('keydown',function(e){if(e.key==='Enter'&&!create.disabled)create.click()});
$('#back').addEventListener('click',function(){show('s1');next.hidden=false});
create.addEventListener('click',function(){
  create.classList.add('busy');create.disabled=true;
  setTimeout(function(){
    var n=ui.value;
    if(taken(n)){create.classList.remove('busy');show('s1');setField(uf,'err');setMsg(umsg,'err','Этот @username уже занят');return}
    db.users[n]={pass:p1.value,cards:[],tx:[],inf:false,bonus:!db.claimed,created:Date.now()};
    if(!db.claimed)db.claimed=n; /* бонус выдан — на этом устройстве больше не будет */
    save();create.classList.remove('busy');enter(n);
  },900);
});
document.querySelectorAll('.eye').forEach(function(b){
  b.addEventListener('click',function(){
    var i=document.getElementById(b.getAttribute('data-for')),s=i.type==='password';
    i.type=s?'text':'password';b.classList.toggle('on',s);
    b.setAttribute('aria-label',s?'Скрыть пароль':'Показать пароль');
  });
});

/* Вход в существующий аккаунт */
var lu=$('#lu'),lp=$('#lp'),lbtn=$('#login'),lmsg=$('#lmsg');
function lchk(){lbtn.disabled=!(lu.value&&lp.value);setField($('#lf1'),'');setField($('#lf2'),'');setMsg(lmsg,'','')}
lu.addEventListener('input',function(){lu.value=clean(lu.value);lchk()});
lp.addEventListener('input',lchk);
function doLogin(){
  if(lbtn.disabled)return;
  var n=lu.value;
  if(has(n)&&passOf(n)===lp.value){
    lbtn.classList.add('busy');lbtn.disabled=true;
    setTimeout(function(){lbtn.classList.remove('busy');enter(n)},700);
  }else{setField($('#lf1'),'err');setField($('#lf2'),'err');setMsg(lmsg,'err','Неверный @username или пароль')}
}
lbtn.addEventListener('click',doLogin);
lu.addEventListener('keydown',function(e){if(e.key==='Enter')lp.focus()});
lp.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});

function resetAuth(){
  ui.value=p1.value=p2.value=lu.value=lp.value='';
  clearTimeout(timer);available=false;next.hidden=true;
  setField(uf,'');setMsg(umsg,'',HINT1);checkPw();lchk();
  document.querySelectorAll('.eye').forEach(function(b){document.getElementById(b.getAttribute('data-for')).type='password';b.classList.remove('on')});
  ['s1','s2','sl'].forEach(function(id){$('#'+id).hidden=id!=='s1'});
  cur='s1';moving=false;$('#bar').style.width='50%';
}
function enter(n,quiet){
  me=n;try{localStorage.setItem('vtbank_session',n)}catch(e){}tab='cards';sel=0;mode='send';
  $('#auth').hidden=true;$('#app').hidden=false;$('#nav').hidden=false;
  window.scrollTo(0,0);render();resetAuth();if(!quiet)toast('Добро пожаловать, @'+n);
}
function logout(){me=null;try{localStorage.removeItem('vtbank_session')}catch(e){}$('#app').hidden=true;$('#nav').hidden=true;$('#auth').hidden=false;window.scrollTo(0,0)}

['UZS','Узбекский сум','Узбекистан',0.0066,'UZS','UZ UZB Uzbekistan'],['KGS','Киргизский сом','Кыргызстан',0.92,'KGS','KG KGZ Kyrgyzstan Киргизия'],['TJS','Таджикский сомони','Таджикистан',8.6,'TJS','TJ TJK Tajikistan'],

];
var CM={};CUR.forEach(function(x){CM[x[0]]={n:x[1],c:x[2],r:x[3],s:x[4]}});
function SY(k){return (CM[k||'RUB']||CM.RUB).s}

function exch(a,from,to){return r2(a*CM[from||'RUB'].r/CM[to||'RUB'].r)}
function cmoney(c){return (c.inf?'∞':fmt(c.bal))+' '+SY(c.cur)}
function setCur(i,to){
  var u=U(),c=u.cards[i],from=c.cur,old=c.bal;
  if(from===to)return;
  if(!c.inf)c.bal=exch(c.bal,from,to);
  c.cur=to;
  if(!c.inf)u.tx.unshift({t:'conv',card:c.num.slice(-4),amt:old,from:from,res:c.bal,cur:to,ts:Date.now()});
  save();
  toast('Карта •••• '+c.num.slice(-4)+': '+(c.inf?'валюта — '+to:fmt(old)+' '+SY(from)+' → '+fmt(c.bal)+' '+SY(to)));
  render();
}
var curIdx=0;
function curBlock(u){
  var h='<h3 class="h3">Валюта карт</h3><p class="sub">Нажмите на карту, чтобы сменить валюту — баланс пересчитается автоматически. Курсы фиксированные (демо): 1 USD = 80,45 ₽.</p>';
  if(!u.cards.length)return h+'<p class="empty" style="margin-top:0">Выпустите карту, и здесь появится выбор её валюты.</p>';
  return h+u.cards.map(function(c,i){
    return '<button class="cr" data-cu="'+i+'" type="button"><span class="m"><b>Карта •••• '+c.num.slice(-4)+'</b><span>'+cname(c.cur)+'</span></span><span class="a">'+cmoney(c)+'</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>';
  }).join('');
}
function norm(t){return t.toLowerCase().replace(/ё/g,'е')}
function hit(x,q){
  var hay=norm(x[0]+' '+x[1]+' '+x[2]+' '+x[5]+' '+tl(x[1],'en')+' '+tl(x[2],'en')+' '+tl(x[1],lang)+' '+tl(x[2],lang));
  if(q.indexOf(' ')>-1)return hay.indexOf(q)>-1;
  return hay.split(/[^a-zа-я0-9]+/).some(function(w){return w.indexOf(q)===0});
}
function curList(q){
  var cur=U().cards[curIdx].cur;q=norm(q.trim());
  var list=CUR.filter(function(x){return !q||hit(x,q)});
  return list.length?list.map(function(x){return '<button class="ci'+(x[0]===cur?' on':'')+'" data-c="'+x[0]+'" type="button"><span><b>'+x[1]+'</b> ('+x[2]+')</span><em>'+x[0]+'</em></button>'}).join('')
    :'<p class="empty">Ничего не найдено. Попробуйте: RUB, USD, USA, RU, UA…</p>';
}
function openCur(i){

  $('#sheet').innerHTML='<div class="grab"></div><h3 class="h3" style="margin-top:0">Валюта карты •••• '+c.num.slice(-4)+'</h3>'+

    '<div class="clist" id="clist">'+curList('')+'</div><button class="ghost" id="closeS" type="button">Закрыть</button>';
  showSheet();$('#closeS').onclick=closeSheet;
}
function perks(u){var n=Date.now();return !!(u.inf||(u.paid&&(u.paid.forever||u.paid.until>n))||u.yt>n)}
function cardLimit(u){return perks(u)?CARD_LIMIT_PLUS:CARD_LIMIT}
function fee(u,amt){return perks(u)?0:r2(amt*COMMISSION)}
function feeText(){return perks(U())?'Комиссия не взимается.':'Комиссия за перевод — '+String(COMMISSION*100).replace('.',',')+'%.'}
function addMonths(ts,k){var d=new Date(ts);d.setMonth(d.getMonth()+k);return d.getTime()}
function dstr(ts){return new Date(ts).toLocaleDateString(LOC[lang],{day:'numeric',month:'long',year:'numeric'})}
function usd(n){return '$'+(n%1?n.toFixed(2).replace('.',lang==='en'?'.':','):n)}

function pay(){
  var u=U(),p=PLANS[planIdx],c=u.cards[payIdx],now=Date.now();

  if(p.m===0)u.paid={forever:true};
  else{var base=u.paid&&u.paid.until>now?u.paid.until:now;u.paid={until:addMonths(base,p.m)}}
  u.discUsed=true; /* скидка — только на первую покупку, любого тарифа */
  u.tx.unshift({t:'sub',card:c.num.slice(-4),amt:cost,cur:c.cur,plan:p.n,ts:now});

function clearErr(){view.querySelectorAll('.field').forEach(function(f){setField(f,'')});setMsg($('#tmsg'),'','')}
function move(a,au,b,bu,sa,sb,pull,fe){
  fe=fe||0;
  var now=Date.now(),ta=a.num.slice(-4),tb=b.num.slice(-4);
  if(!a.inf)a.bal=r2(a.bal-sa-(pull?0:fe));
  if(!b.inf)b.bal=r2(b.bal+sb-(pull?fe:0));
  au.tx.unshift({t:'out',card:ta,peer:tb,amt:sa,cur:a.cur,k:pull,fee:pull?0:fe,ts:now});
  bu.tx.unshift({t:'in',card:tb,peer:ta,amt:sb,cur:b.cur,k:pull,fee:pull?fe:0,ts:now});
  save();
  var d=a.cur!==b.cur,ft=fe?' (комиссия '+fmt(fe)+' '+SY(pull?b.cur:a.cur)+')':'';
  toast(pull?'Карта •••• '+tb+' пополнена на '+fmt(sb)+' '+SY(b.cur)+(d?' (списано '+fmt(sa)+' '+SY(a.cur)+')':'')+ft
    :'Переведено '+fmt(sa)+' '+SY(a.cur)+(d?' — получатель получит '+fmt(sb)+' '+SY(b.cur):'')+ft);
  render();
}
function doSend(){
  var u=U(),c=u.cards[sel],num=$('#cn').value.replace(/\s/g,''),amt=r2(parseFloat($('#amt').value.replace(',','.')));
  clearErr();
  if(num.length!==16)return bad(['#nf'],'Введите 16 цифр номера карты получателя');
  var r=find(num);
  if(!r)return bad(['#nf'],'Карта получателя не найдена');
  if(r.c===c)return bad(['#nf'],'Нельзя перевести на ту же карту');
  if(!(amt>0))return bad(['#af'],'Введите сумму больше нуля');
  var fe=fee(u,amt);
  if(!c.inf&&amt+fe>c.bal)return bad(['#af'],fe?'Недостаточно средств с учётом комиссии':'Недостаточно средств на карте');
  var got=exch(amt,c.cur,r.c.cur);
  if(!(got>0))return bad(['#af'],'Слишком маленькая сумма для этой валюты');
  move(c,u,r.c,r.u,amt,got,'',fe);
}
function doPull(){
  var u=U(),dest=u.cards[sel],num=$('#cn').value.replace(/\s/g,''),ex=$('#ex').value,cv=$('#cv').value,pw=$('#pw').value,amt=r2(parseFloat($('#amt').value.replace(',','.')));
  clearErr();
  if(num.length!==16)return bad(['#nf'],'Введите 16 цифр номера карты');
  if(!/^\d\d\/\d\d$/.test(ex))return bad(['#xf'],'Срок действия — в формате ММ/ГГ');
  if(cv.length!==3)return bad(['#vf'],'CVV — это 3 цифры');
  if(!pw)return bad(['#wf'],'Введите пароль карты');
  if(!(amt>0))return bad(['#af'],'Введите сумму больше нуля');
  var r=find(num);
  if(!r||r.c.exp!==ex||r.c.cvv!==cv||r.c.pwd!==pw)return bad(['#nf','#xf','#vf','#wf'],'Неверные реквизиты карты — перевод невозможен');
  if(r.c===dest)return bad(['#nf'],'Нельзя списать деньги с той же карты');
  var take=exch(amt,dest.cur,r.c.cur);
  if(!(take>0))return bad(['#af'],'Слишком маленькая сумма для этой валюты');
  if(!r.c.inf&&take>r.c.bal)return bad(['#af'],'На карте-источнике недостаточно средств');
  move(r.c,r.u,dest,u,take,amt,'1',fee(u,amt));
}
function submit(){(mode==='send'?doSend:doPull)()}

  if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE')return;
  trEl(n);
  for(var c=n.firstChild;c;c=c.nextSibling)walk(c);
}
new MutationObserver(function(ms){
  ms.forEach(function(m){
    if(m.type==='childList')m.addedNodes.forEach(walk);
    else if(m.type==='characterData')trNode(m.target);
    else trEl(m.target);
  });
}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTR});
function langOf(l){return LANGS.filter(function(x){return x[0]===l})[0]}
function langBlock(){
  var L=langOf(lang);
  return '<h3 class="h3">Язык интерфейса</h3><button class="cr" id="langBtn" type="button"><span class="m"><b>'+L[1]+'</b><span>'+L[2]+'</span></span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>';
}
function openLang(){
  $('#sheet').innerHTML='<div class="grab"></div><h3 class="h3" style="margin-top:0">Язык интерфейса</h3>'+
    LANGS.map(function(L){return '<button class="ci'+(L[0]===lang?' on':'')+'" data-l="'+L[0]+'" type="button"><span><b>'+L[1]+'</b> ('+L[2]+')</span><em>'+L[0].toUpperCase()+'</em></button>'}).join('')+
    '<button class="ghost" id="closeS" type="button">Закрыть</button>';
  showSheet();$('#closeS').onclick=closeSheet;
}
function setLang(l){
  closeSheet();lang=l;try{localStorage.setItem('vtbank_lang',l)}catch(e){}
  document.documentElement.setAttribute('lang',l);walk(document.body);if(me)render();
}
document.documentElement.setAttribute('lang',lang);
if(lang!=='ru')walk(document.body);

if(!db.bonusFix){
  var first=Object.keys(db.users).filter(function(n){return !Object.prototype.hasOwnProperty.call(FIXED,n)}).sort(function(a,b){return db.users[a].created-db.users[b].created})[0];
  if(first){
    var f=db.users[first],fc=f.cards[0];
    if(!f.tx.some(function(x){return x.t==='bonus'})){
      if(fc){var ba=exch(START_BONUS,'RUB',fc.cur);fc.bal=r2(fc.bal+ba);f.tx.unshift({t:'bonus',card:fc.num.slice(-4),amt:ba,cur:fc.cur,ts:Date.now()});f.bonus=false}
      else f.bonus=true;
    }
    db.claimed=first;
  }
  db.bonusFix=true;save();
}

var sess=null;try{sess=localStorage.getItem('vtbank_session')}catch(e){}
if(sess&&has(sess))enter(sess,true);
})();
